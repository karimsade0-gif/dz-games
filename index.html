<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Games - Belote & Poker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0284c7;
        }
        .game-area {
            margin-top: 20px;
            padding: 15px;
            background: #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DZ Games 🃏</h1>
        <p>Bienvenue sur votre plateforme de jeux en ligne algérienne !</p>
        
        <div class="game-area">
            <h3>Mode de jeu actif</h3>
            <p id="status-text">Sélectionnez un jeu pour commencer.</p>
            <button class="btn" onclick="startBelote()">Jouer à la Belote</button>
            <button class="btn" onclick="startPoker()">Jouer au Poker</button>
        </div>
    </div>

    <script>
        function startBelote() {
            document.getElementById('status-text').innerHTML = "🎮 Partie de Belote lancée ! En cas de déconnexion, un robot prend le relais automatiquement.";
        }

        function startPoker() {
            document.getElementById('status-text').innerHTML = "🃏 Partie de Poker lancée ! En cas de déconnexion, un robot prend le relais automatiquement.";
        }
    </script>

</body>
</html>
